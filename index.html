<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction Ticket Oscars des Vacances</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #025457, #f2f2f2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.20);
        }

        /* EN-TÊTE */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background-color: #025457;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 5px 15px rgba(2, 84, 87, 0.3);
        }

        h1 {
            color: #025457;
            font-size: 25px;
            margin: 0;
            line-height: 1.3;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-top: 8px;
        }

        /* FORMULAIRE */

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #025457;
            box-shadow: 0 0 0 3px rgba(2, 84, 87, 0.10);
        }

        input[readonly] {
            background-color: #eeeeee;
            color: #025457;
            font-weight: bold;
        }

        /* BOUTONS */

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-wave,
        .btn-accueil {
            background-color: #025457;
        }

        .btn-wave:hover,
        .btn-accueil:hover {
            background-color: #013b3d;
            transform: translateY(-1px);
        }

        /* CONFIRMATION */

        .success {
            display: none;
            text-align: center;
        }

        .success-icon {
            width: 75px;
            height: 75px;
            background-color: #e8f5f5;
            color: #025457;
            border: 3px solid #025457;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        .success h2 {
            color: #025457;
            margin-bottom: 12px;
            font-size: 24px;
        }

        .success p {
            color: #555;
            line-height: 1.6;
        }

        .details {
            background-color: #f5fafa;
            border-left: 4px solid #025457;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }

        .details p {
            margin: 8px 0;
        }

        .details strong {
            color: #025457;
        }

        /* PIED */

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- PAGE DE PAIEMENT -->

        <div id="paymentPage">

            <div class="header">

                <div class="header-icon">
                    🎟
                </div>

                <h1>
                    Transaction Ticket<br>
                    Oscars des Vacances
                </h1>

                <div class="subtitle">
                    Paiement sécurisé de votre ticket
                </div>

            </div>


            <label for="nom">
                Nom :
            </label>

            <input
                type="text"
                id="nom"
                placeholder="Entrez votre nom"
            >


            <label for="montant">
                Montant :
            </label>

            <input
                type="number"
                id="montant"
                value="200"
                readonly
            >


            <button
                class="btn-wave"
                onclick="payerWave()"
            >
                Payer avec Wave
            </button>


            <div class="footer">
                Oscars des Vacances
            </div>

        </div>


        <!-- PAGE DE SUCCÈS -->

        <div id="successPage" class="success">

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Paiement effectué
            </h2>

            <p>
                Merci
                <strong id="nomClient"></strong>.
            </p>

            <p>
                Votre paiement de
                <strong>200 FCFA</strong>
                a été enregistré.
            </p>


            <div class="details">

                <p>
                    Ticket :
                    <strong>Oscars des Vacances</strong>
                </p>

                <p>
                    Montant :
                    <strong>200 FCFA</strong>
                </p>

                <p>
                    Date :
                    <strong id="datePaiement"></strong>
                </p>

            </div>


            <button
                class="btn-accueil"
                onclick="retourAccueil()"
            >
                Retour à l'accueil
            </button>

        </div>

    </div>


    <script>

        // Vérifier le retour après paiement

        window.onload = function () {

            const paiementEffectue =
                localStorage.getItem("paiementWave");

            const nom =
                localStorage.getItem("nomClient");

            if (paiementEffectue === "oui" && nom) {

                afficherSucces(nom);

            }

        };


        // Paiement Wave

        function payerWave() {

            const nom =
                document.getElementById("nom").value.trim();

            if (nom === "") {

                alert("Veuillez entrer votre nom.");

                return;

            }

            // Enregistrer le nom

            localStorage.setItem(
                "nomClient",
                nom
            );


            // Enregistrer l'état du paiement

            localStorage.setItem(
                "paiementWave",
                "oui"
            );


            // Ouvrir le paiement Wave

            window.location.href =
                "https://pay.wave.com/m/M_sn_j1b0Ooln3-6Q/c/sn/?amount=200";

        }


        // Afficher la confirmation

        function afficherSucces(nom) {

            document.getElementById(
                "paymentPage"
            ).style.display = "none";


            document.getElementById(
                "successPage"
            ).style.display = "block";


            document.getElementById(
                "nomClient"
            ).textContent = nom;


            const maintenant = new Date();


            document.getElementById(
                "datePaiement"
            ).textContent =
                maintenant.toLocaleString(
                    "fr-FR",
                    {
                        dateStyle: "long",
                        timeStyle: "medium"
                    }
                );

        }


        // Retour à l'accueil

        function retourAccueil() {

            localStorage.removeItem(
                "paiementWave"
            );

            localStorage.removeItem(
                "nomClient"
            );

            window.location.href =
                window.location.pathname;

        }

    </script>

</body>

</html>
